# Deploys to production server on every push to development-v2
name: Deploy to Server

on:
  push:
    branches:
      - development-v2
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            BASE=$(node -p "const v=require('./package.json').version.split('.');v.slice(0,2).join('.')")
            VERSION="${BASE}.${{ github.run_number }}"
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "==> Version: $VERSION"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: VERSION
          script: |
            set -e
            cd ${{ secrets.SERVER_DEPLOY_PATH }}

            echo "==> Pulling latest code..."
            git pull origin development-v2

            echo "==> Building version $VERSION..."
            VERSION=$VERSION docker compose up -d --build

            echo "==> Waiting for container to be healthy..."
            sleep 10

            echo "==> Running database migrations..."
            docker exec ${CONTAINER_NAME:-dev-erp-system-be} npm run db:migrate

            echo "==> Deployment complete! Version: $VERSION"
        env:
          VERSION: ${{ steps.version.outputs.value }}

version: '3.8'

services:
  # Backend API Service
  api-erp:
    image: ${CONTAINER_NAME}:latest
    container_name: ${CONTAINER_NAME:-erp-system-be}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    networks:
      - tunnel
    restart: unless-stopped

networks:
  tunnel:
    external: true

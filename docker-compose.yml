version: '3.8'

services:
  # Backend API Service
  api-erp:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    environment:
      # Only overriding host-specific variables
      POSTGRE_HOST: postgres_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  # PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRE_DB:-inventory_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USERNAME:-postgres} -d ${POSTGRE_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge

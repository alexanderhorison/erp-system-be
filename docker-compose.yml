version: '3.8'

services:
  # Backend API Service
  api-erp:
    container_name: ${CONTAINER_NAME:-erp-system-be}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    networks:
      - tunnel
    restart: unless-stopped
    # Memory and resource limits to prevent crashes
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Health check for login endpoint
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-4000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tunnel:
    external: true
